environments {
  firefox {
    webdriver {
      driver = firefox
      capabilities {
        "moz:firefoxOptions" {
          prefs {
            browser.download.folderList = 2
            browser.download.dir = ${user.dir}
            download.useDownloadDir = true
            helperApps.neverAsk.saveToDisk = "application/pdf;text/plain;application/text;text/xml;application/xml"
            pdfjs.disabled = true
          }
        }
      }
    }
  }
  chrome {
    webdriver {
      driver = chrome
      capabilities {
        browserVersion = "120"
        browserName = "chrome"
        "goog:chromeOptions" {
          args = ["--disable-features=LocalNetworkAccessChecks", "--disable-dev-shm-usage", "--remote-allow-origins=*", "--disable-gpu", "--remote-debugging-pipe"],
          prefs {
            "download.default_directory" = ${user.dir}
            "download.prompt_for_download" = false
          }
        }
      }
    }
  }
  edge {
    webdriver {
      driver = edge
      capabilities {
        browserName = "MicrosoftEdge"
        "ms:edgeOptions" {
          prefs {
            "download.default_directory" = ${user.dir}
            "download.prompt_for_download" = false
          }
        }
      }
    }
  }
}