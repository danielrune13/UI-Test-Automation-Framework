environments {
  firefox {
    webdriver {
      driver = firefox
      preferences {
        "browser.download.folderList" = 2
        "browser.download.dir" = ${user.dir}
        "browser.download.useDownloadDir" = true
        "browser.helperApps.neverAsk.saveToDisk" = "application/pdf"
      }
    }
  }
  chrome {
    webdriver {
      driver = chrome
      capabilities {
        browserVersion = "120"
        browserName = "chrome"
        "goog:chromeOptions" {
          args = ["--disable-features=LocalNetworkAccessChecks", "--disable-dev-shm-usage", "--remote-allow-origins=*", "--disable-gpu", "--remote-debugging-pipe"],
          prefs {
            "download.default_directory" = ${user.dir}
            "download.prompt_for_download" = false
          }
        }
      }
    }
  }
  edge {
    webdriver {
      driver = edge
      capabilities {
        browserName = "MicrosoftEdge"
        "ms:edgeOptions" {
          prefs {
            "download.default_directory" = ${user.dir}
            "download.prompt_for_download" = false
          }
        }
      }
    }
  }
}