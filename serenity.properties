serenity.project.name="UI Test Automation Framework"
serenity.take.screenshots=BEFORE_AND_AFTER_EACH_STEP
serenity.console.colors = true
serenity.dry.run=false
serenity.verbose.steps=true
serenity.reports.show.step.details=true
serenity.browser.maximized=true
webdriver.reuse.driver = false
serenity.driver.factory = net.serenitybdd.core.webdriver.driverproviders.ThreadLocalDriverProvider